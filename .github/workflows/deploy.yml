name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nazmulhasn/azizcom_website:${{ github.sha }}
            nazmulhasn/azizcom_website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: IMAGE_NAME,IMAGE_TAG
          script: |
            set -e
            active_container=azizcom_website
            candidate_container=azizcom_website_candidate
            previous_container=azizcom_website_previous
            image="$IMAGE_NAME:$IMAGE_TAG"

            docker pull "$image"
            if docker inspect "$active_container" >/dev/null 2>&1; then
              network=$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$active_container")
            else
              network=azizcom-website_azizcom_website_net
              docker network inspect "$network" >/dev/null 2>&1 || docker network create "$network"
            fi

            docker rm -f "$candidate_container" "$previous_container" 2>/dev/null || true
            docker run -d \
              --name "$candidate_container" \
              --restart unless-stopped \
              --network "$network" \
              --env-file /opt/azizcom/.env \
              -e PORT=3000 \
              "$image"

            healthy=false
            for attempt in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$candidate_container" 2>/dev/null || true)
              if [ "$status" = "healthy" ]; then
                healthy=true
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                break
              fi
              sleep 2
            done

            if [ "$healthy" != "true" ]; then
              docker logs "$candidate_container"
              docker rm -f "$candidate_container"
              echo "Candidate container failed health check; current container is unchanged."
              exit 1
            fi

            if docker inspect "$active_container" >/dev/null 2>&1; then
              docker rename "$active_container" "$previous_container"
              if ! docker rename "$candidate_container" "$active_container"; then
                docker rename "$previous_container" "$active_container"
                docker rm -f "$candidate_container" 2>/dev/null || true
                echo "Container switch failed; previous container restored."
                exit 1
              fi
              docker rm -f "$previous_container"
            else
              docker rename "$candidate_container" "$active_container"
            fi
            docker start "$active_container" >/dev/null
            final_status=$(docker inspect --format '{{.State.Status}}' "$active_container")
            final_health=$(docker inspect --format '{{.State.Health.Status}}' "$active_container")
            if [ "$final_status" != "running" ] || [ "$final_health" != "healthy" ]; then
              docker logs "$active_container"
              echo "Active container verification failed: status=$final_status health=$final_health"
              exit 1
            fi
        env:
          IMAGE_NAME: nazmulhasn/azizcom_website
          IMAGE_TAG: ${{ github.sha }}
